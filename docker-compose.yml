# Despliegue sobre el VPS de OpenATS, cuyo Caddy publica los puertos 80 y 443 y
# gestiona el TLS. Por eso aquí no hay reverse proxy ni puertos publicados: el
# servicio se une a la red de ese Caddy, que lo alcanza por nombre de contenedor.
name: portfolio

services:
  web:
    build:
      context: .
      args:
        GITHUB_USERNAME: ${GITHUB_USERNAME:?define GITHUB_USERNAME en .env}
    # Nombre fijo: es el que usa Caddy en su `reverse_proxy`.
    container_name: portfolio
    restart: unless-stopped
    environment:
      GITHUB_USERNAME: ${GITHUB_USERNAME:?define GITHUB_USERNAME en .env}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?define PROXY_NETWORK en .env}
