name: portfolio

services:
  web:
    build:
      context: .
      args:
        GITHUB_USERNAME: ${GITHUB_USERNAME:?define GITHUB_USERNAME en .env}
    restart: unless-stopped
    environment:
      GITHUB_USERNAME: ${GITHUB_USERNAME:?define GITHUB_USERNAME en .env}
    # Solo en local: para exponerlo a internet, ponlo detrás de un reverse proxy.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
